[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveplayer"
version = "0.1.0"
description = "解析 B站/斗鱼/虎牙 直播与 B站视频直链，并通过本地代理交给 PotPlayer 播放的 Host（Edge 原生消息）。"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "greada" }]
keywords = ["bilibili", "douyu", "huya", "potplayer", "native-messaging", "live"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[project.scripts]
liveplayer = "liveplayer.__main__:main"

[project.urls]
Homepage = "https://github.com/greada/live-player"

[tool.setuptools]
packages = ["liveplayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 只启用基础规则，避免对既有代码产生大量风格告警。
select = ["E", "F"]
ignore = ["E501", "E402"]
