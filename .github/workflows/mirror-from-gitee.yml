name: Mirror from Gitee

# 从 Gitee 仓库拉取分支/标签并同步到本 GitHub 仓库。
# 说明：Gitee 的开放 API 不支持镜像配置，故用 GitHub Actions 反向拉取实现自动同步。
# 注意：定时任务在仓库 60 天无活动后会被 GitHub 自动暂停，届时手动触发一次即可恢复。

on:
  schedule:
    - cron: "17 3 * * *" # 每天 03:17 UTC
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: mirror-from-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch from Gitee
        run: |
          set -euo pipefail
          git remote add gitee "https://gitee.com/greada/live-player.git"
          git fetch --force --prune --tags gitee '+refs/heads/*:refs/remotes/gitee/*'

      - name: Push branches and tags to GitHub
        run: |
          set -euo pipefail
          git push --force origin 'refs/remotes/gitee/*:refs/heads/*'
          git push --force --tags origin
